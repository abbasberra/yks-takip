(function loadChartJs(){
  var urls = [
    "https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.8/chart.umd.min.js",
    "https://cdn.jsdelivr.net/npm/chart.js@4.4.8/dist/chart.umd.min.js",
    "https://unpkg.com/chart.js@4.4.8/dist/chart.umd.min.js"
  ];
  function tryLoad(i){
    if(i>=urls.length){ console.warn('Chart.js hiçbir kaynaktan yüklenemedi.'); return; }
    var s = document.createElement('script');
    s.src = urls[i];
    s.onerror = function(){ tryLoad(i+1); };
    s.onload = function(){
      if(typeof activeTab !== 'undefined' && activeTab === 'net' && typeof renderNetChart === 'function'){
        try{ render(); }catch(e){}
      }
    };
    document.head.appendChild(s);
  }
  tryLoad(0);
})();
</script>

<style>
  :root{
    --ink:#1B2A4A;
    --ink-2:#2E4066;
    --paper:#F6F3EA;
    --paper-2:#EEE8D9;
    --card:#FCFAF3;
    --sage:#6B8F71;
    --sage-dark:#4F6E55;
    --amber:#D98E3D;
    --clay:#B5493F;
    --charcoal:#2B2B2B;
    --line:#E1D9C4;
    --muted:#8A806D;
    --radius:14px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper);
    color:var(--charcoal);
    font-family:'Inter',sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  #yks-app{
    display:flex;
    min-height:100vh;
    background:
      repeating-linear-gradient(to bottom, transparent, transparent 38px, rgba(27,42,74,0.045) 39px),
      var(--paper);
  }
  .yks-sidebar{
    width:220px;
    flex:0 0 220px;
    background:var(--ink);
    color:#EFE9DA;
    padding:28px 0;
    display:flex;
    flex-direction:column;
    gap:2px;
    position:sticky;
    top:0;
    align-self:flex-start;
    min-height:100vh;
  }
  .yks-brand{
    font-family:'Fraunces',serif;
    font-weight:700;
    font-size:20px;
    padding:0 22px 22px 22px;
    border-bottom:1px solid rgba(255,255,255,0.12);
    margin-bottom:14px;
    letter-spacing:0.2px;
  }
  .yks-brand small{
    display:block;
    font-family:'Inter',sans-serif;
    font-weight:500;
    font-size:11.5px;
    color:#B9C3D6;
    margin-top:4px;
    letter-spacing:0.4px;
    text-transform:uppercase;
  }
  .yks-tab{
    display:flex;
    align-items:center;
    gap:10px;
    padding:12px 22px;
    cursor:pointer;
    font-size:14.5px;
    font-weight:500;
    color:#CBD3E3;
    border-left:3px solid transparent;
    transition:background .15s, color .15s;
  }
  .yks-tab .yks-tab-num{
    font-family:'JetBrains Mono',monospace;
    font-size:11.5px;
    color:#7C88A6;
    width:18px;
  }
  .yks-tab:hover{ background:rgba(255,255,255,0.06); color:#fff; }
  .yks-tab.active{
    background:rgba(255,255,255,0.09);
    border-left-color:var(--amber);
    color:#fff;
  }
  .yks-tab.active .yks-tab-num{ color:var(--amber); }
  .yks-main{
    flex:1;
    padding:36px 44px 80px 44px;
    max-width:1080px;
  }
  .yks-h1{
    font-family:'Fraunces',serif;
    font-size:30px;
    font-weight:700;
    margin:0 0 6px 0;
    color:var(--ink);
  }
  .yks-sub{
    color:var(--muted);
    font-size:14.5px;
    margin:0 0 28px 0;
  }
  .yks-card{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:22px 24px;
    margin-bottom:20px;
  }
  .yks-card-title{
    font-family:'Fraunces',serif;
    font-weight:600;
    font-size:17px;
    color:var(--ink);
    margin:0 0 14px 0;
    display:flex;
    align-items:center;
    justify-content:space-between;
  }
  .yks-grid2{ display:grid; grid-template-columns:1fr 1fr; gap:18px; }
  .yks-grid3{ display:grid; grid-template-columns:repeat(3,1fr); gap:16px; }
  @media (max-width:820px){ .yks-grid2,.yks-grid3{grid-template-columns:1fr;} }

  label.yks-label{
    display:block;
    font-size:12.5px;
    font-weight:600;
    color:var(--muted);
    text-transform:uppercase;
    letter-spacing:0.4px;
    margin-bottom:6px;
  }
  input[type=text], input[type=date], input[type=number], select, textarea{
    width:100%;
    font-family:'Inter',sans-serif;
    font-size:14px;
    padding:9px 11px;
    border:1px solid var(--line);
    border-radius:9px;
    background:#fff;
    color:var(--charcoal);
  }
  input:focus, select:focus, textarea:focus{
    outline:2px solid var(--sage);
    outline-offset:1px;
  }
  textarea{ resize:vertical; min-height:70px; }
  .yks-btn{
    display:inline-flex;
    align-items:center;
    gap:6px;
    background:var(--ink);
    color:#fff;
    border:none;
    padding:10px 18px;
    border-radius:9px;
    font-weight:600;
    font-size:13.5px;
    cursor:pointer;
    transition:background .15s;
  }
  .yks-btn:hover{ background:var(--ink-2); }
  .yks-btn.amber{ background:var(--amber); }
  .yks-btn.amber:hover{ background:#C27A28; }
  .yks-btn.sage{ background:var(--sage); }
  .yks-btn.sage:hover{ background:var(--sage-dark); }
  .yks-btn.ghost{
    background:transparent;
    color:var(--clay);
    border:1px solid var(--clay);
    padding:6px 12px;
    font-size:12.5px;
  }
  .yks-btn.ghost:hover{ background:rgba(181,73,63,0.08); }
  .yks-btn.small{ padding:6px 12px; font-size:12.5px; }
  .yks-pill{
    display:inline-block;
    padding:3px 10px;
    border-radius:100px;
    font-size:11.5px;
    font-weight:700;
    font-family:'JetBrains Mono',monospace;
  }
  .yks-pill.tyt{ background:rgba(107,143,113,0.16); color:var(--sage-dark); }
  .yks-pill.ayt{ background:rgba(217,142,61,0.18); color:#9C6221; }
  .yks-pill.book{ background:rgba(27,42,74,0.09); color:var(--ink); }

  /* Dashboard hero ruler */
  .yks-ruler-wrap{ overflow-x:auto; padding-bottom:6px; }
  .yks-stat-row{ display:flex; gap:16px; flex-wrap:wrap; margin-bottom:6px; }
  .yks-stat{
    flex:1;
    min-width:130px;
    background:var(--paper-2);
    border-radius:11px;
    padding:14px 16px;
  }
  .yks-stat .num{
    font-family:'JetBrains Mono',monospace;
    font-size:26px;
    font-weight:700;
    color:var(--ink);
    line-height:1;
  }
  .yks-stat .lbl{ font-size:12px; color:var(--muted); margin-top:6px; font-weight:600; }

  /* Weekly plan */
  .yks-week{
    border:1px solid var(--line);
    border-radius:12px;
    margin-bottom:12px;
    overflow:hidden;
    background:var(--card);
  }
  .yks-week-head{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:13px 18px;
    cursor:pointer;
    background:var(--paper-2);
  }
  .yks-week-head.current{ background:rgba(217,142,61,0.16); }
  .yks-week-title{ font-weight:700; font-size:14.5px; color:var(--ink); }
  .yks-week-dates{ font-family:'JetBrains Mono',monospace; font-size:12px; color:var(--muted); margin-left:10px; }
  .yks-week-progress{ font-family:'JetBrains Mono',monospace; font-size:12.5px; color:var(--sage-dark); font-weight:700; }
  .yks-week-body{ padding:14px 18px 18px 18px; display:none; }
  .yks-week-body.open{ display:block; }
  .yks-subj-block{ margin-bottom:14px; }
  .yks-subj-name{ font-weight:700; font-size:13px; color:var(--ink-2); margin-bottom:6px; }
  .yks-topic-row{
    display:flex;
    align-items:center;
    gap:9px;
    padding:5px 0;
    font-size:13.5px;
    border-bottom:1px dashed var(--line);
  }
  .yks-topic-row:last-child{ border-bottom:none; }
  .yks-topic-row input[type=checkbox]{ width:16px; height:16px; accent-color:var(--sage); flex:0 0 auto; }
  .yks-topic-row.done label{ text-decoration:line-through; color:var(--muted); }
  .yks-topic-row label{ flex:1; cursor:pointer; }
  .yks-mark-weak{
    border:none; background:none; color:var(--clay); font-size:11px; cursor:pointer;
    font-weight:700; opacity:0.55; padding:2px 4px;
  }
  .yks-mark-weak:hover{ opacity:1; }
  .yks-review-list{ font-size:13.5px; line-height:1.9; color:var(--charcoal); }

  table.yks-table{ width:100%; border-collapse:collapse; font-size:13.5px; }
  table.yks-table th{
    text-align:left; font-size:11.5px; text-transform:uppercase; letter-spacing:0.3px;
    color:var(--muted); border-bottom:2px solid var(--line); padding:8px 8px;
  }
  table.yks-table td{ padding:9px 8px; border-bottom:1px solid var(--line); vertical-align:top; }
  table.yks-table tr:last-child td{ border-bottom:none; }
  .yks-net-total{ font-family:'JetBrains Mono',monospace; font-weight:700; color:var(--ink); }
  .yks-empty{
    text-align:center; padding:34px 20px; color:var(--muted); font-size:14px;
    border:1px dashed var(--line); border-radius:12px; background:var(--paper-2);
  }
  .yks-log-item{
    border:1px solid var(--line); border-radius:11px; padding:12px 14px; margin-bottom:10px; background:var(--card);
  }
  .yks-log-item.wrong{ border-left:4px solid var(--clay); }
  .yks-log-item.good{ border-left:4px solid var(--sage); }
  .yks-log-item.qitem{ border-left:4px solid var(--amber); }
  .yks-photo-thumb{ max-width:240px; max-height:240px; border-radius:9px; margin-top:8px; display:block; border:1px solid var(--line); }
  .yks-photo-input-wrap input[type=file]{
    font-size:12.5px; padding:7px; background:var(--paper-2); border:1px dashed var(--line); border-radius:9px; width:100%;
  }
  .yks-log-top{ display:flex; justify-content:space-between; align-items:center; margin-bottom:5px; }
  .yks-log-meta{ font-size:11.5px; color:var(--muted); font-family:'JetBrains Mono',monospace; }
  .yks-filter-bar{ display:flex; gap:8px; margin-bottom:14px; flex-wrap:wrap; }
  .yks-chip{
    padding:6px 13px; border-radius:100px; font-size:12.5px; font-weight:600;
    border:1px solid var(--line); background:#fff; cursor:pointer; color:var(--charcoal);
  }
  .yks-chip.active{ background:var(--ink); color:#fff; border-color:var(--ink); }
  .yks-toast{
    position:fixed; bottom:22px; right:26px; background:var(--ink); color:#fff;
    padding:11px 18px; border-radius:10px; font-size:13.5px; font-weight:600;
    box-shadow:0 6px 18px rgba(0,0,0,0.18); opacity:0; transform:translateY(8px);
    transition:opacity .2s, transform .2s; pointer-events:none; z-index:999;
  }
  .yks-toast.show{ opacity:1; transform:translateY(0); }
  ::selection{ background:rgba(217,142,61,0.35); }

  .yks-modal-overlay{
    position:fixed; inset:0; background:rgba(27,42,74,0.55);
    display:flex; align-items:center; justify-content:center; z-index:1000; padding:20px;
  }
  .yks-modal-box{
    background:var(--card); border-radius:16px; padding:28px 30px; width:320px;
    max-width:100%; box-shadow:0 20px 50px rgba(0,0,0,0.25);
  }
  .yks-agenda-block{ border-top:1px dashed var(--line); margin-top:14px; padding-top:4px; }
  .yks-agenda-days{ display:grid; grid-template-columns:repeat(7,1fr); gap:10px; margin-top:6px; }
  .yks-agenda-day{
    background:var(--paper-2);
    border-radius:11px;
    padding:12px 11px;
    min-height:240px;
    display:flex;
    flex-direction:column;
  }
  .yks-agenda-day label.yks-label{ margin-bottom:9px; }
  .yks-agenda-list{ display:flex; flex-direction:column; gap:7px; flex:1; margin-bottom:10px; }
  .yks-agenda-item{
    display:flex;
    align-items:flex-start;
    gap:8px;
    background:var(--card);
    border:1px solid var(--line);
    border-radius:9px;
    padding:9px 10px;
    transition:background .15s, border-color .15s;
  }
  .yks-agenda-item:hover{ border-color:var(--sage); }
  .yks-agenda-item input[type=checkbox]{
    appearance:none;
    -webkit-appearance:none;
    margin-top:2px;
    width:19px;
    height:19px;
    flex:0 0 19px;
    cursor:pointer;
    border:2px solid var(--sage);
    border-radius:6px;
    position:relative;
    background:#fff;
  }
  .yks-agenda-item input[type=checkbox]:checked{
    background:var(--sage);
  }
  .yks-agenda-item input[type=checkbox]:checked::after{
    content:'';
    position:absolute;
    left:5px; top:1px;
    width:5px; height:10px;
    border:solid #fff;
    border-width:0 2px 2px 0;
    transform:rotate(40deg);
  }
  .yks-agenda-item span{
    flex:1;
    font-size:13.5px;
    line-height:1.45;
    word-break:break-word;
    cursor:pointer;
    padding-top:1px;
  }
  .yks-agenda-item.done{ background:rgba(107,143,113,0.08); }
  .yks-agenda-item.done span{ text-decoration:line-through; color:var(--muted); }
  .yks-agenda-item .yks-agenda-del{
    flex:0 0 auto;
    border:none;
    background:transparent;
    color:var(--clay);
    cursor:pointer;
    font-size:15px;
    line-height:1;
    padding:2px 3px;
    opacity:0.55;
  }
  .yks-agenda-item .yks-agenda-del:hover{ opacity:1; }
  .yks-agenda-empty{ font-size:12px; color:var(--muted); font-style:italic; padding:4px 0 2px 0; }
  .yks-agenda-add{ display:flex; gap:6px; margin-top:auto; }
  .yks-agenda-add input{ flex:1; font-size:13px; padding:9px 10px; }
  .yks-agenda-add button{ flex:0 0 auto; padding:9px 13px; font-size:15px; }
  @media (max-width:900px){ .yks-agenda-days{ grid-template-columns:repeat(2,1fr); } }
</style>
</head>

function todayStr(){ return new Date().toISOString().slice(0,10); }
function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
function fmtDate(d){
  if(!d) return "-";
  const parts = d.split("-");
  if(parts.length!==3) return d;
  return parts[2] + "." + parts[1] + "." + parts[0];
}

function uploadPdfToKey(file, key, maxBytes){
  maxBytes = maxBytes || 4500000;
  if(!file) return Promise.resolve(null);
  if(file.type && file.type !== 'application/pdf'){
    toast("Lütfen bir PDF dosyası seç.");
    return Promise.resolve(null);
  }
  if(file.size > maxBytes){
    toast("Bu dosya çok büyük (yaklaşık 5 MB üstü). Daha küçük / bölünmüş bir PDF dene.");
    return Promise.resolve(null);
  }
  return new Promise((resolve)=>{
    const reader = new FileReader();
    reader.onload = async (e)=>{
      const dataUrl = e.target.result;
      try{
        const res = await window.storage.set(key, dataUrl, false);
        if(!res){ toast("PDF kaydedilemedi, tekrar dene."); resolve(null); return; }
        pdfCache[key] = dataUrl;
        resolve(dataUrl);
      }catch(err){
        toast("PDF kaydedilemedi — dosya çok büyük olabilir.");
        resolve(null);
      }
    };
    reader.onerror = ()=>{ toast("Dosya okunamadı."); resolve(null); };
    reader.readAsDataURL(file);
  });
}

async function openStoredPdf(key){
  let dataUrl = pdfCache[key];
  if(!dataUrl){
    try{
      const res = await window.storage.get(key, false);
      if(res && res.value) dataUrl = res.value;
    }catch(e){ /* not found */ }
  }
  if(dataUrl){
    pdfCache[key] = dataUrl;
    const w = window.open();
    if(w){
      w.document.write('<title>PDF</title><iframe src="'+dataUrl+'" style="border:none;width:100%;height:100vh;"></iframe>');
    } else {
      toast("Yeni sekme açılamadı, tarayıcı ayarlarını kontrol et.");
    }
  } else {
    toast("PDF bulunamadı.");
  }
}

async function deleteStoredPdf(key){
  delete pdfCache[key];
  try{ await window.storage.delete(key, false); }catch(e){ /* already gone */ }
}

// ---------- WEEK PLAN LOGIC ----------
function getActiveAytSubjects(){
  const track = state.profile.track;
  const out = {};
  Object.keys(AYT_SUBJECTS).forEach(k=>{
    if(AYT_SUBJECTS[k].tracks.includes(track)) out[k] = AYT_SUBJECTS[k];
  });
  return out;
}
function getAllActiveSubjects(){
  return Object.assign({}, TYT_SUBJECTS, getActiveAytSubjects());
}

function getWeeksInfo(){
  const start = new Date(state.profile.startDate + "T00:00:00");
  // Snap to the Monday on/before the start date so every week (and the agenda) begins on Pazartesi
  const dow = start.getDay(); // 0=Sun..6=Sat
  const diffToMonday = (dow === 0) ? -6 : (1 - dow);
  start.setDate(start.getDate() + diffToMonday);
  const exam = new Date(state.profile.examDate + "T00:00:00");
  let totalWeeks = Math.ceil((exam - start) / (7*24*3600*1000));
  if(totalWeeks < 4) totalWeeks = 4;
  const weeksForTopics = Math.max(2, Math.floor(totalWeeks * 0.65));
  return { start, exam, totalWeeks, weeksForTopics };
}

function buildWeeklyAssignments(){
  const { weeksForTopics } = getWeeksInfo();
  const subjects = getAllActiveSubjects();
  const weekMap = {}; // weekIndex -> { subjKey: [topics] }
  Object.keys(subjects).forEach(subjKey=>{
    const topics = subjects[subjKey].topics;
    topics.forEach((topic, i)=>{
      let w = Math.floor(i * weeksForTopics / topics.length);
      if(w >= weeksForTopics) w = weeksForTopics - 1;
      if(!weekMap[w]) weekMap[w] = {};
      if(!weekMap[w][subjKey]) weekMap[w][subjKey] = [];
      weekMap[w][subjKey].push(topic);
    });
  });
  return weekMap;
}

function topicKey(subjKey, topic){ return subjKey + "::" + topic; }

function computeOverallProgress(){
  const subjects = getAllActiveSubjects();
  let total=0, done=0;
  Object.keys(subjects).forEach(subjKey=>{
    subjects[subjKey].topics.forEach(topic=>{
      total++;
      if(state.checks[topicKey(subjKey, topic)]) done++;
    });
  });
  return { total, done, pct: total? Math.round(done/total*100):0 };
}

function weekDateRange(idx, start){
  const s = new Date(start.getTime() + idx*7*24*3600*1000);
  const e = new Date(s.getTime() + 6*24*3600*1000);
  const f = d => (d.getDate()+"").padStart(2,'0')+"."+((d.getMonth()+1)+"").padStart(2,'0');
  return f(s) + " – " + f(e);
}

function currentWeekIndex(){
  const { start } = getWeeksInfo();
  const now = new Date();
  const diff = Math.floor((now - start) / (7*24*3600*1000));
  return diff;
}

  const curWeek = currentWeekIndex();

  const chips = `<div class="yks-filter-bar">
    <div class="yks-chip ${filterVar==='all'?'active':''}" data-progsubj="${group}:all">Tümü</div>
    ${subjKeys.map(k=>`<div class="yks-chip ${filterVar===k?'active':''}" data-progsubj="${group}:${k}">${allSubjects[k].name}</div>`).join('')}
  </div>`;

  let infoNote = '';
  if(group==='ayt' && subjKeys.length===0){
    infoNote = `<div class="yks-empty">Seçili alan için AYT dersi bulunamadı. Panel sekmesinden alanını (Sayısal / Eşit Ağırlık / Sözel) kontrol et.</div>`;
  } else if(group==='ayt'){
    infoNote = `<p class="yks-sub" style="margin-top:-10px;">Henüz 11. sınıftaysan AYT konuları biraz erken olabilir — bu sekme, sırası geldiğinde kullanman için burada hazır duruyor.</p>`;
  }

  let weeksHtml = "";
  for(let w=0; w<totalWeeks; w++){
    const isCurrent = w===curWeek;
    const wkey = group+':'+w;
    const isOpen = openWeeks[wkey] || (isCurrent && !(wkey in openWeeks));
    let subjHtml=""; let weekTotal=0, weekDone=0;

    if(w < weeksForTopics){
      const assigns = weekMap[w] || {};
      const relevantKeys = subjKeys.filter(k => assigns[k] && (filterVar==='all' || filterVar===k));
      if(relevantKeys.length===0){
        subjHtml = `<div class="yks-review-list">Bu hafta bu derste yeni konu atanmadı — önceki konuları pekiştir.</div>`;
      } else {
        relevantKeys.forEach(subjKey=>{
          const topics = assigns[subjKey];
          const subjName = allSubjects[subjKey].name;
          subjHtml += `<div class="yks-subj-block"><div class="yks-subj-name">${subjName}</div>`;
          topics.forEach(topic=>{
            const tk = topicKey(subjKey, topic);
            const done = !!state.checks[tk];
            weekTotal++; if(done) weekDone++;
            subjHtml += `<div class="yks-topic-row ${done?'done':''}">
              <input type="checkbox" data-topickey="${escapeAttr(tk)}" ${done?'checked':''}>
              <label>${escapeHtml(topic)}</label>

            </div>`;
          });
          subjHtml += `</div>`;
        });
      }
    } else {
      subjHtml = group==='tyt' ? `<div class="yks-review-list">
        • Genel tekrar: zayıf olduğun TYT konularını "Eksik Konular"dan gözden geçir.<br>
        • En az 1 TYT denemesi çöz, "Net Hesaplama"ya kaydet.<br>
        • Yanlış yaptığın soruları "Soru Kayıtları"na ekle ve tekrar çöz.
      </div>` : `<div class="yks-review-list">
        • AYT derslerinde zayıf konularını "Eksik Konular"dan gözden geçir.<br>
        • En az 1 AYT denemesi çöz, "Net Hesaplama"ya kaydet.<br>
        • Yanlış yaptığın AYT sorularını "Soru Kayıtları"na ekle ve tekrar çöz.
      </div>`;
    }

    const dateRange = weekDateRange(w, start);
    const progressLabel = (w<weeksForTopics && weekTotal>0) ? `${weekDone}/${weekTotal}` : (w<weeksForTopics? '' : 'Tekrar');
    const agendaHtml = renderWeekAgenda(w, start);

    weeksHtml += `<div class="yks-week">
      <div class="yks-week-head ${isCurrent?'current':''}" data-weektoggle="${wkey}">
        <div><span class="yks-week-title">Hafta ${w+1}${isCurrent?' · Şu An':''}</span><span class="yks-week-dates">${dateRange}</span></div>
        <div class="yks-week-progress">${progressLabel}</div>
      </div>
      <div class="yks-week-body ${isOpen?'open':''}" data-weekbody="${wkey}">${subjHtml}${agendaHtml}</div>
    </div>`;
  }

  const title = group==='tyt' ? 'TYT Programı' : 'AYT Programı';
  return `
    <h1 class="yks-h1">${title}</h1>
    <p class="yks-sub">${fmtDate(state.profile.startDate)} — ${fmtDate(state.profile.examDate)} arası ${totalWeeks} hafta ·
      Konu bitirme dönemi ilk ${weeksForTopics} hafta, sonrası tekrar &amp; deneme.</p>
    ${infoNote}
    ${chips}
    ${weeksHtml}
  `;
}

const TURKISH_DAYS = ["Pazar","Pazartesi","Salı","Çarşamba","Perşembe","Cuma","Cumartesi"];

function getWeekAgenda(w){
  let agenda = state.weekAgenda[w];
  if(!agenda){
    agenda = { days:[[],[],[],[],[],[],[]] };
    state.weekAgenda[w] = agenda;
  }
  if(!Array.isArray(agenda.days)) agenda.days = [[],[],[],[],[],[],[]];
  for(let i=0;i<7;i++){
    const d = agenda.days[i];
    if(typeof d === 'string'){
      // eski serbest-metin formatından madde/checkbox listesine geçiş
      const lines = d.split('\n').map(s=>s.trim()).filter(Boolean);
      agenda.days[i] = lines.map(t=>({ id: uid(), text:t, done:false }));
    } else if(!Array.isArray(d)){
      agenda.days[i] = [];
    }
  }
  return agenda;
}

function renderWeekAgenda(w, start){
  const agenda = getWeekAgenda(w);
  let dayCells = "";
  for(let i=0;i<7;i++){
    const d = new Date(start.getTime() + (w*7 + i)*24*3600*1000);
    const label = TURKISH_DAYS[d.getDay()];
    const dateLabel = (d.getDate()+"").padStart(2,'0') + "." + ((d.getMonth()+1)+"").padStart(2,'0');
    const items = agenda.days[i] || [];
    const itemsHtml = items.length ? items.map(it=>`
      <div class="yks-agenda-item ${it.done?'done':''}">
        <input type="checkbox" ${it.done?'checked':''} data-agendacheck="${w}:${i}:${it.id}">
        <span data-agendatext="${w}:${i}:${it.id}">${escapeHtml(it.text)}</span>
        <button class="yks-agenda-del" data-agendadel="${w}:${i}:${it.id}" title="Sil">✕</button>
      </div>`).join("") : `<div class="yks-agenda-empty">Henüz madde yok.</div>`;
    dayCells += `<div class="yks-agenda-day">
      <label class="yks-label">${label} <span style="font-weight:400;text-transform:none;color:var(--muted);">${dateLabel}</span></label>
      <div class="yks-agenda-list">${itemsHtml}</div>
      <div class="yks-agenda-add">
        <input type="text" placeholder="Madde ekle..." data-agendainput="${w}:${i}">
        <button class="yks-btn sage small" data-agendaadd="${w}:${i}">+</button>
      </div>
    </div>`;
  }
  return `<div class="yks-agenda-block">
    <div class="yks-card-title" style="font-size:14px;margin:16px 0 4px 0;">🗓️ Bu Haftanın Ajandası</div>
    <div class="yks-agenda-days">${dayCells}</div>
  </div>`;
}

function computeNetPreview(subjList){
  let totalQ = 0, totalD = 0, totalY = 0, totalNet = 0;
  subjList.forEach(s=>{
    const qEl = document.getElementById('q-'+s.key);
    const dEl = document.getElementById('d-'+s.key);
    const yEl = document.getElementById('y-'+s.key);
    const bEl = document.getElementById('b-'+s.key);
    const q = parseInt(qEl && qEl.value)||0;
    const d = parseInt(dEl && dEl.value)||0;
    const y = parseInt(yEl && yEl.value)||0;
    const bos = Math.max(q - d - y, 0);
    if(bEl) bEl.value = bos;
    totalQ += q; totalD += d; totalY += y;
    totalNet += (d - y/4);
  });
  const previewEl = document.getElementById('net-preview');
  if(previewEl){
    const pct = totalQ>0 ? (totalNet/totalQ*100) : 0;
    previewEl.textContent = `Toplam: ${totalQ} soru üzerinden ${totalNet.toFixed(2)} net (%${pct.toFixed(1)})`;
  }
  return { totalQ, totalD, totalY, totalNet };
}

function netPct(r){
  if(!r.totalQuestions) return null;
  return Math.round((r.totalNet/r.totalQuestions*100)*10)/10;
}

function renderNetChart(){
  const canvas = document.getElementById('net-chart');
  if(!canvas) return;
  if(!window.Chart){
    canvas.outerHTML = '<div class="yks-empty">Grafik kütüphanesi (Chart.js) yüklenemedi. İnternet bağlantınızı kontrol edip sayfayı yenileyin.</div>';
    console.warn('Chart.js yüklenmedi - net grafiği çizilemiyor.');
    return;
  }
  if(netChart) netChart.destroy();
  const ordered = [...state.netResults].sort((a,b)=>{
    if(a.date !== b.date) return a.date.localeCompare(b.date);
    return (a.id||"").localeCompare(b.id||"");
  });
  const labels = ordered.map(r=>fmtDate(r.date));
  const tytData = ordered.map(r=> r.type==='tyt' ? netPct(r) : null);
  const aytData = ordered.map(r=> r.type==='ayt' ? netPct(r) : null);
  try{
    netChart = new Chart(canvas.getContext('2d'), {
      type:'line',
      data:{
        labels: labels,
        datasets:[
          { label:'TYT Başarı %', data: tytData,
            borderColor:'#6B8F71', backgroundColor:'rgba(107,143,113,0.12)', spanGaps:true, tension:0.25 },
          { label:'AYT Başarı %', data: aytData,
            borderColor:'#D98E3D', backgroundColor:'rgba(217,142,61,0.12)', spanGaps:true, tension:0.25 }
        ]
      },
      options:{
        responsive:true,
        maintainAspectRatio:false,
        plugins:{
          legend:{ position:'bottom' },
          tooltip:{ callbacks:{ label: (ctx)=>{
            const r = ordered[ctx.dataIndex];
            if(!r || ctx.parsed.y===null) return null;
            const extra = r.totalQuestions ? ` (${r.totalNet.toFixed(2)} net / ${r.totalQuestions} soru${r.name? ' — '+r.name : ''})` : '';
            return `${ctx.dataset.label}: %${ctx.formattedValue}${extra}`;
          } } }
        },
        scales:{ y:{ beginAtZero:true, max:100, ticks:{ callback:(v)=>'%'+v } } }
      }
    });
  } catch(e){
    console.error('Net grafiği çizilirken hata oluştu:', e);
    canvas.closest('div').outerHTML = '<div class="yks-empty">Grafik çizilirken bir hata oluştu. Tarayıcı konsolunu (F12) kontrol edin.</div>';
  }
}

function resizeImageFile(file){
  return new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onload = (e)=>{
      const img = new Image();
      img.onload = ()=>{
        let w = img.width, h = img.height;
        const maxDim = 700;
        if(w > maxDim || h > maxDim){
          if(w > h){ h = Math.round(h * maxDim / w); w = maxDim; }
          else { w = Math.round(w * maxDim / h); h = maxDim; }
        }
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        canvas.getContext('2d').drawImage(img, 0, 0, w, h);
        resolve(canvas.toDataURL('image/jpeg', 0.72));
      };
      img.onerror = reject;
      img.src = e.target.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

async function loadVisiblePhotos(){
  const slots = document.querySelectorAll('[data-photoid]');
  for(const slot of slots){
    const id = slot.dataset.photoid;
    if(photoCache[id]){
      slot.innerHTML = `<img src="${photoCache[id]}" class="yks-photo-thumb">`;
      continue;
    }
    try{
      const res = await window.storage.get('qphoto:'+id, false);
      if(res && res.value){
        photoCache[id] = res.value;
        slot.innerHTML = `<img src="${res.value}" class="yks-photo-thumb">`;
      } else {
        slot.innerHTML = `<span class="yks-log-meta">Fotoğraf bulunamadı.</span>`;
      }
    }catch(e){
      slot.innerHTML = `<span class="yks-log-meta">Fotoğraf yüklenemedi.</span>`;
    }
  }
}

// Türkçe karakterleri sadeleştirip küçük harfe çeviren normalizasyon fonksiyonu
function normalizeTr(str){
  return String(str||'')
    .toLocaleLowerCase('tr')
    .replace(/ı/g,'i').replace(/İ/g,'i')
    .replace(/ğ/g,'g').replace(/ü/g,'u').replace(/ş/g,'s')
    .replace(/ö/g,'o').replace(/ç/g,'c')
    .replace(/[^a-z0-9]+/g,' ')
    .trim();
}

// Girilen konu metnini, o ders için bankada kayıtlı konu başlıklarıyla eşleştirir.
// Önce tam eşleşme, sonra içerme (substring) eşleşmesi dener.
function findBankTopic(subjectName, topic){
  const bank = QUESTION_BANK[subjectName];
  if(!bank) return null;
  const keys = Object.keys(bank);
  const nTopic = normalizeTr(topic);
  if(!nTopic) return null;

  // 1) tam eşleşme
  for(const k of keys){ if(normalizeTr(k) === nTopic) return k; }

  // 2) biri diğerini içeriyorsa (kısmi eşleşme)
  let best = null, bestScore = 0;
  for(const k of keys){
    const nk = normalizeTr(k);
    if(nk.includes(nTopic) || nTopic.includes(nk)){
      const score = Math.min(nk.length, nTopic.length);
      if(score > bestScore){ bestScore = score; best = k; }
    }
  }
  return best;
}

async function generatePracticeQuestions(subjectName, topic){
  const matchedTopic = findBankTopic(subjectName, topic);
  if(!matchedTopic){
    const availableTopics = QUESTION_BANK[subjectName] ? Object.keys(QUESTION_BANK[subjectName]) : [];
    const err = new Error("topic_not_found");
    err.availableTopics = availableTopics;
    throw err;
  }
  // Küçük bir yapay gecikme: "Üretiliyor..." animasyonunun görünmesi için
  await new Promise(res => setTimeout(res, 250));
  return QUESTION_BANK[subjectName][matchedTopic];
}

}

// Foto ve PDF'ler büyük olabildiği için (Firestore doküman limiti ~1MB) bunlar
// bulutta değil, tarayıcının kendi IndexedDB'sinde (cihaza özel) saklanır.
// Bu sayede kart/ücretli plan gerekmeden her şey Spark (ücretsiz) planda çalışır.
function isLocalOnlyKey(key){
  return key.indexOf('qphoto:') === 0 || key.indexOf('examqpdf:') === 0;
}

function openLocalDB(){
  return new Promise((resolve, reject)=>{
    const req = indexedDB.open('yks_local_files', 1);
    req.onupgradeneeded = ()=>{ req.result.createObjectStore('files'); };
    req.onsuccess = ()=>resolve(req.result);
    req.onerror = ()=>reject(req.error);
  });
}
async function localGet(key){
  const db = await openLocalDB();
  return new Promise((resolve, reject)=>{
    const tx = db.transaction('files','readonly');
    const req = tx.objectStore('files').get(key);
    req.onsuccess = ()=>resolve(req.result===undefined? null : req.result);
    req.onerror = ()=>reject(req.error);
  });
}
async function localSet(key, value){
  const db = await openLocalDB();
  return new Promise((resolve, reject)=>{
    const tx = db.transaction('files','readwrite');
    tx.objectStore('files').put(value, key);
    tx.oncomplete = ()=>resolve(true);
    tx.onerror = ()=>reject(tx.error);
  });
}
async function localDelete(key){
  const db = await openLocalDB();
  return new Promise((resolve, reject)=>{
    const tx = db.transaction('files','readwrite');
    tx.objectStore('files').delete(key);
    tx.oncomplete = ()=>resolve(true);
    tx.onerror = ()=>reject(tx.error);
  });
}

// window.storage ile aynı arayüzü taklit eden katman.
// Küçük/metinsel veriler (profil, checkler, notlar...) Firestore'a gider ve her cihazdan senkron olur.
// qphoto:/examqpdf: ile başlayan büyük foto/PDF verileri ise sadece bu cihazın tarayıcısında kalır.
function makeCloudStorage(uid){
  const coll = fbFirestore.collection('users').doc(uid).collection('kv');
  return {
    async get(key){
      if(isLocalOnlyKey(key)){
        try{
          const value = await localGet(key);
          if(value == null) return null;
          return { key, value, shared:false };
        }catch(e){ return null; }
      }
      try{
        const snap = await coll.doc(encodeURIComponent(key)).get();
        if(!snap.exists) return null;
        const data = snap.data();
        return { key, value: data && data.v, shared:false };
      }catch(e){ return null; }
    },
    async set(key, value){
      if(isLocalOnlyKey(key)){
        try{ await localSet(key, value); return { key, value, shared:false }; }
        catch(e){ return null; }
      }
      try{
        await coll.doc(encodeURIComponent(key)).set({ v: String(value) });
        return { key, value, shared:false };
      }catch(e){ return null; }
    },
    async delete(key){
      if(isLocalOnlyKey(key)){
        try{ await localDelete(key); return { key, deleted:true, shared:false }; }
        catch(e){ return null; }
      }
      try{
        await coll.doc(encodeURIComponent(key)).delete();
        return { key, deleted:true, shared:false };
      }catch(e){ return null; }
    },
    async list(prefix){
      try{
        const snap = await coll.get();
        let keys = snap.docs.map(d=>decodeURIComponent(d.id));
        if(prefix) keys = keys.filter(k=>k.startsWith(prefix));
        return { keys, prefix, shared:false };
      }catch(e){ return null; }
    }
  };
}

// Misafir modu: Google hesabı olmadan kullanmak isteyenler için, window.storage
// arayüzünün aynısını taklit eder ama veriler bulut yerine sadece bu cihazda
// (localStorage + foto/PDF'ler için IndexedDB) saklanır. Cihaz/tarayıcı değişirse
// veriler senkron olmaz; bu yüzden ayarlar ekranında kullanıcıya bu açıkça belirtilir.
const GUEST_KV_PREFIX = 'guestkv:';
function makeGuestStorage(){
  return {
    async get(key){
      if(isLocalOnlyKey(key)){
        try{
          const value = await localGet(key);
          if(value == null) return null;
          return { key, value, shared:false };
        }catch(e){ return null; }
      }
      try{
        const raw = localStorage.getItem(GUEST_KV_PREFIX + key);
        if(raw == null) return null;
        return { key, value: raw, shared:false };
      }catch(e){ return null; }
    },
    async set(key, value){
      if(isLocalOnlyKey(key)){
        try{ await localSet(key, value); return { key, value, shared:false }; }
        catch(e){ return null; }
      }
      try{
        localStorage.setItem(GUEST_KV_PREFIX + key, String(value));
        return { key, value, shared:false };
      }catch(e){ return null; }
    },
    async delete(key){
      if(isLocalOnlyKey(key)){
        try{ await localDelete(key); return { key, deleted:true, shared:false }; }
        catch(e){ return null; }
      }
      try{
        localStorage.removeItem(GUEST_KV_PREFIX + key);
        return { key, deleted:true, shared:false };
      }catch(e){ return null; }
    },
    async list(prefix){
      try{
        let keys = [];
        for(let i=0;i<localStorage.length;i++){
          const k = localStorage.key(i);
          if(k && k.indexOf(GUEST_KV_PREFIX)===0) keys.push(k.slice(GUEST_KV_PREFIX.length));
        }
        if(prefix) keys = keys.filter(k=>k.startsWith(prefix));
        return { keys, prefix, shared:false };
      }catch(e){ return null; }
    }
  };
}
